kind = "web"
previewPath = "/"
title = "Academic Compass"
version = "1.0.0"
id = "artifacts/academic-compass"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21550

[services.development]
run = "pnpm --filter @workspace/academic-compass run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/academic-compass", "run", "build" ]
serve = "static"
publicDir = "artifacts/academic-compass/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21550"
BASE_PATH = "/"
