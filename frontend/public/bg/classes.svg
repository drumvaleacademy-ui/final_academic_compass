<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Classroom desks -->
  <g opacity="0.05">
    <rect x="150" y="200" width="120" height="60" rx="4" fill="#166534"/>
    <rect x="300" y="200" width="120" height="60" rx="4" fill="#166534"/>
    <rect x="450" y="200" width="120" height="60" rx="4" fill="#166534"/>
    <rect x="600" y="200" width="120" height="60" rx="4" fill="#166534"/>
    <rect x="150" y="320" width="120" height="60" rx="4" fill="#166534"/>
    <rect x="300" y="320" width="120" height="60" rx="4" fill="#166534"/>
    <rect x="450" y="320" width="120" height="60" rx="4" fill="#166534"/>
    <rect x="600" y="320" width="120" height="60" rx="4" fill="#166534"/>
    <!-- Chairs -->
    <rect x="170" y="170" width="80" height="20" rx="4" fill="#15803d"/>
    <rect x="320" y="170" width="80" height="20" rx="4" fill="#15803d"/>
    <rect x="470" y="170" width="80" height="20" rx="4" fill="#15803d"/>
    <rect x="620" y="170" width="80" height="20" rx="4" fill="#15803d"/>
  </g>
  <!-- Blackboard -->
  <rect x="320" y="80" width="160" height="100" rx="4" fill="#14532d" opacity="0.04"/>
  <rect x="330" y="90" width="140" height="80" rx="2" fill="#14532d" opacity="0.03"/>
</svg>
