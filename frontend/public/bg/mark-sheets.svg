<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Spreadsheet grid -->
  <g opacity="0.05">
    <rect x="150" y="120" width="500" height="360" rx="4" fill="#475569"/>
    <!-- Grid -->
    <line x1="150" y1="180" x2="650" y2="180" stroke="#ffffff" stroke-width="1"/>
    <line x1="150" y1="240" x2="650" y2="240" stroke="#ffffff" stroke-width="1"/>
    <line x1="150" y1="300" x2="650" y2="300" stroke="#ffffff" stroke-width="1"/>
    <line x1="150" y1="360" x2="650" y2="360" stroke="#ffffff" stroke-width="1"/>
    <line x1="150" y1="420" x2="650" y2="420" stroke="#ffffff" stroke-width="1"/>
    <line x1="230" y1="120" x2="230" y2="480" stroke="#ffffff" stroke-width="1"/>
    <line x1="310" y1="120" x2="310" y2="480" stroke="#ffffff" stroke-width="1"/>
    <line x1="390" y1="120" x2="390" y2="480" stroke="#ffffff" stroke-width="1"/>
    <line x1="470" y1="120" x2="470" y2="480" stroke="#ffffff" stroke-width="1"/>
    <line x1="550" y1="120" x2="550" y2="480" stroke="#ffffff" stroke-width="1"/>
  </g>
</svg>
