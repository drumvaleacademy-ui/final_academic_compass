<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- User profile -->
  <g opacity="0.06">
    <circle cx="400" cy="220" r="70" fill="#4f46e5"/>
    <circle cx="400" cy="200" r="30" fill="#6366f1"/>
    <rect x="340" y="280" width="120" height="140" rx="8" fill="#6366f1"/>
    <!-- ID badge -->
    <rect x="360" y="310" width="80" height="50" rx="4" fill="#e0e7ff"/>
    <line x1="370" y1="325" x2="430" y2="325" stroke="#4f46e5" stroke-width="2"/>
    <line x1="370" y1="340" x2="430" y2="340" stroke="#4f46e5" stroke-width="2"/>
  </g>
</svg>
