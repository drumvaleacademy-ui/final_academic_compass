<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Books stack -->
  <g opacity="0.06">
    <rect x="280" y="320" width="240" height="30" rx="2" fill="#7c3aed"/>
    <rect x="290" y="290" width="220" height="25" rx="2" fill="#2563eb"/>
    <rect x="300" y="262" width="200" height="23" rx="2" fill="#dc2626"/>
    <rect x="310" y="235" width="180" height="22" rx="2" fill="#16a34a"/>
    <rect x="320" y="210" width="160" height="20" rx="2" fill="#ea580c"/>
    <!-- Book spine lines -->
    <line x1="340" y1="210" x2="340" y2="350" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
    <line x1="380" y1="210" x2="380" y2="350" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
    <line x1="420" y1="210" x2="420" y2="350" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
    <line x1="460" y1="210" x2="460" y2="350" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  </g>
  <!-- Graduation cap -->
  <polygon points="400,140 480,180 400,220 320,180" fill="#7c3aed" opacity="0.05"/>
  <rect x="395" y="180" width="10" height="60" fill="#7c3aed" opacity="0.04"/>
  <line x1="405" y1="185" x2="450" y2="160" stroke="#7c3aed" stroke-width="2" opacity="0.05"/>
  <circle cx="455" cy="158" r="6" fill="#7c3aed" opacity="0.06"/>
</svg>
