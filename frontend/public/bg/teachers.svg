<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Teacher figure -->
  <g opacity="0.06">
    <circle cx="400" cy="240" r="35" fill="#0891b2"/>
    <rect x="370" y="285" width="60" height="100" rx="6" fill="#0891b2"/>
    <!-- Book in hand -->
    <rect x="430" y="310" width="40" height="50" rx="2" fill="#06b6d4"/>
    <!-- Pointer -->
    <line x1="440" y1="350" x2="480" y2="280" stroke="#0891b2" stroke-width="3"/>
    <circle cx="482" cy="278" r="4" fill="#0891b2"/>
  </g>
  <!-- Students at desks -->
  <g opacity="0.04">
    <rect x="200" y="420" width="100" height="50" rx="4" fill="#0891b2"/>
    <rect x="350" y="420" width="100" height="50" rx="4" fill="#0891b2"/>
    <rect x="500" y="420" width="100" height="50" rx="4" fill="#0891b2"/>
  </g>
</svg>
