<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Timetable grid -->
  <g opacity="0.06">
    <rect x="150" y="100" width="500" height="400" rx="4" fill="#4f46e5"/>
    <!-- Grid lines -->
    <line x1="150" y1="160" x2="650" y2="160" stroke="#ffffff" stroke-width="1"/>
    <line x1="150" y1="220" x2="650" y2="220" stroke="#ffffff" stroke-width="1"/>
    <line x1="150" y1="280" x2="650" y2="280" stroke="#ffffff" stroke-width="1"/>
    <line x1="150" y1="340" x2="650" y2="340" stroke="#ffffff" stroke-width="1"/>
    <line x1="150" y1="400" x2="650" y2="400" stroke="#ffffff" stroke-width="1"/>
    <line x1="150" y1="460" x2="650" y2="460" stroke="#ffffff" stroke-width="1"/>
    <line x1="220" y1="100" x2="220" y2="500" stroke="#ffffff" stroke-width="1"/>
    <line x1="290" y1="100" x2="290" y2="500" stroke="#ffffff" stroke-width="1"/>
    <line x1="360" y1="100" x2="360" y2="500" stroke="#ffffff" stroke-width="1"/>
    <line x1="430" y1="100" x2="430" y2="500" stroke="#ffffff" stroke-width="1"/>
    <line x1="500" y1="100" x2="500" y2="500" stroke="#ffffff" stroke-width="1"/>
    <line x1="570" y1="100" x2="570" y2="500" stroke="#ffffff" stroke-width="1"/>
  </g>
  <!-- Clock -->
  <circle cx="680" cy="120" r="50" fill="#4f46e5" opacity="0.05"/>
  <line x1="680" y1="120" x2="680" y2="90" stroke="#4f46e5" stroke-width="3" opacity="0.08"/>
  <line x1="680" y1="120" x2="700" y2="120" stroke="#4f46e5" stroke-width="2" opacity="0.08"/>
</svg>
