<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="100%" stop-color="#cffafe"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- Certificate / transcript -->
  <g opacity="0.06">
    <rect x="200" y="140" width="400" height="320" rx="8" fill="#0891b2"/>
    <rect x="220" y="160" width="360" height="280" rx="4" fill="#ecfeff"/>
    <!-- Seal -->
    <circle cx="400" cy="320" r="50" fill="none" stroke="#0891b2" stroke-width="3"/>
    <circle cx="400" cy="320" r="40" fill="none" stroke="#0891b2" stroke-width="1"/>
    <text x="400" y="325" text-anchor="middle" fill="#0891b2" font-size="12" opacity="0.3">PASS</text>
    <!-- Ribbon -->
    <polygon points="400,270 420,290 400,310 380,290" fill="#dc2626" opacity="0.15"/>
  </g>
</svg>
